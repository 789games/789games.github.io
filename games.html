<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>789 - Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root { --neon-red: #ff0033; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; color: #fff; font-family: 'Orbitron', sans-serif; overflow-x: hidden; position: relative; background: #0a0a0a; }
        #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.92; }
        .header { text-align: center; padding: 120px 20px 80px; position: relative; z-index: 10; }
        .title { font-size: 4.8rem; font-weight: 700; letter-spacing: 10px; text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px var(--neon-red);
                 animation: revealLine 2.8s ease-out forwards, rainbowPulse 3.8s ease-in-out 3s forwards, settleRed 0.8s 6.8s forwards; }
        @keyframes revealLine { 0% { letter-spacing: 50px; opacity: 0.3; text-shadow: 0 0 30px #ff3366; filter: blur(8px); }
            100% { letter-spacing: 10px; opacity: 1; text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px var(--neon-red); filter: blur(0); } }
        @keyframes rainbowPulse { 0% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; } 12% { text-shadow: 0 0 20px #ff8800, 0 0 40px #ff8800; } 
            25% { text-shadow: 0 0 20px #ffff00, 0 0 40px #ffff00; } 37% { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; } 
            50% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; } 62% { text-shadow: 0 0 20px #0066ff, 0 0 40px #0066ff; } 
            75% { text-shadow: 0 0 20px #cc00ff, 0 0 40px #cc00ff; } 88% { text-shadow: 0 0 20px #ff0088, 0 0 40px #ff0088; } 
            100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; } }
        @keyframes settleRed { to { text-shadow: 0 0 10px var(--neon-red), 0 0 25px var(--neon-red), 0 0 50px var(--neon-red), 0 0 80px var(--neon-red); } }
        .grid-container { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 40px 20px 100px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; }
        .neon-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; background: rgba(34, 0, 0, 0.55); color: #fff;
                    border: 4px solid var(--neon-red); border-radius: 16px; box-shadow: 0 0 12px var(--neon-red), 0 0 22px var(--neon-red); text-shadow: 0 0 10px var(--neon-red);
                    cursor: pointer; transition: all 0.4s ease; text-decoration: none; min-height: 220px; }
        .neon-btn:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 0 25px var(--neon-red), 0 0 45px var(--neon-red); background: rgba(34, 0, 0, 0.8); }
        .neon-btn .icon { width: 92px; height: 92px; margin-bottom: 18px; object-fit: contain; filter: drop-shadow(0 0 12px var(--neon-red)); transition: transform 0.4s ease; }
        .neon-btn:hover .icon { transform: scale(1.15) rotate(8deg); }
        .neon-btn .label { font-size: 1.35rem; font-weight: 700; letter-spacing: 3px; text-align: center; line-height: 1.3; }
        .coming-soon { margin-top: 8px; font-size: 0.95rem; color: #ff3366; text-shadow: 0 0 8px #ff3366; letter-spacing: 2px; }
        @media (max-width: 1200px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 900px) { .grid-container { grid-template-columns: repeat(3, 1fr); } .neon-btn { min-height: 200px; padding: 22px 15px; } .neon-btn .icon { width: 78px; height: 78px; } }
        @media (max-width: 600px) { .grid-container { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <div class="header">
        <h1 class="title">GAMES</h1>
    </div>
    
    <div class="grid-container" id="game-grid"></div>

    <script>
        const gameList = [
            { name: "1V1.LOL", link: "1v1-lol/index.html", icon: "https://imgs.crazygames.com/auto-covers/1v1-lol_1x1.png?format=auto&quality=70&metadata=none" },
            { name: "MARIO 64", link: "https://blakecakegit.github.io/sm64/f.html", icon: "https://i1.sndcdn.com/artworks-000130658008-ed2uwn-t500x500.jpg" },
            { name: "SONIC CD", link: "https://tws2401.github.io/Sonic-CD-WASM/", icon: "https://lastfm.freetls.fastly.net/i/u/500x500/4fd33ff464192d73e7d0da4b4dd6ebcf.jpg" },
        ];

        function createGameButtons() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 50; i++) {
                const item = gameList[i-1] || { name: `GAME ${i}`, link: "#", icon: "https://via.placeholder.com/92x92/220022/FF3366?text=GAME" };

                const btn = document.createElement('a');
                btn.href = item.link;
                btn.className = "neon-btn";
                btn.target = "_blank";

                btn.innerHTML = `
                    <img src="${item.icon}" class="icon" alt="${item.name}">
                    <div class="label">${item.name}</div>
                    <div class="coming-soon"></div>
                `;

                grid.appendChild(btn);
            }
        }

        // Background Animation (identical to tools)
        const bgCanvas = document.getElementById('background-canvas');
        const bgCtx = bgCanvas.getContext('2d', { alpha: true });
        let fallingPieces = [];
        let lastTime = 0;

        const TETROMINOS = [
            { color: '#00ffff', shape: [[1,1,1,1]] },
            { color: '#ffff00', shape: [[1,1],[1,1]] },
            { color: '#aa00ff', shape: [[0,1,0],[1,1,1]] },
            { color: '#00ff00', shape: [[0,1,1],[1,1,0]] },
            { color: '#ff0000', shape: [[1,1,0],[0,1,1]] },
            { color: '#0000ff', shape: [[1,0,0],[1,1,1]] },
            { color: '#ff8800', shape: [[0,0,1],[1,1,1]] }
        ];

        class FallingPiece {
            constructor() {
                const tet = TETROMINOS[Math.floor(Math.random() * TETROMINOS.length)];
                this.color = tet.color;
                this.shape = tet.shape;
                this.size = 26 + Math.random() * 24;
                this.x = Math.random() * (window.innerWidth - this.size * 4);
                this.y = -this.size * 4;
                this.speed = 1.6 + Math.random() * 3.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.055;
            }
            update() { this.y += this.speed; this.rotation += this.rotationSpeed; }
            draw() {
                bgCtx.save();
                bgCtx.translate(this.x + this.size * 2, this.y + this.size * 2);
                bgCtx.rotate(this.rotation);
                const s = this.size;
                bgCtx.shadowBlur = 28;
                bgCtx.shadowColor = this.color;
                for (let r = 0; r < this.shape.length; r++) {
                    for (let c = 0; c < this.shape[r].length; c++) {
                        if (this.shape[r][c]) {
                            const px = (c - this.shape[r].length/2) * s;
                            const py = (r - this.shape.length/2) * s;
                            bgCtx.fillStyle = this.color;
                            bgCtx.fillRect(px, py, s - 4, s - 4);
                            bgCtx.fillStyle = 'rgba(255,255,255,0.65)';
                            bgCtx.fillRect(px + 6, py + 6, s - 16, 8);
                        }
                    }
                }
                bgCtx.restore();
            }
        }

        function resizeBackground() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }

        function animateBackground(timestamp) {
            if (!lastTime) lastTime = timestamp;
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            if (Math.random() < 0.085) fallingPieces.push(new FallingPiece());
            for (let i = fallingPieces.length - 1; i >= 0; i--) {
                const piece = fallingPieces[i];
                piece.update();
                piece.draw();
                if (piece.y > bgCanvas.height + 100) fallingPieces.splice(i, 1);
            }
            requestAnimationFrame(animateBackground);
        }

        window.addEventListener('load', () => {
            createGameButtons();
            resizeBackground();
            requestAnimationFrame(animateBackground);
            window.addEventListener('resize', () => setTimeout(resizeBackground, 100));
        });
    </script>
</body>
</html>
